<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOTA 2 AI Assistant</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #c23c2a;
    --accent-glow: rgba(194, 60, 42, 0.45);
    --bg: #0b0c10;
    --surface: #12151c;
    --panel-bg: #161922;
    --card-bg: #1c202c;
    --border: #222736;
    --border-light: #2c3345;
    --text-primary: #e6ebf2;
    --text-secondary: #8b94a5;
    --user-bubble: #82221b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, #1a1e2a 0%, #0b0c10 70%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #12141a 0%, #200d0f 50%, #3d0e10 100%);
    border-bottom: 2px solid var(--accent);
    color: #fff;
    padding: .85rem 1.4rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: .75rem;
    box-shadow: 0 4px 20px rgba(0,0,0,.7);
    letter-spacing: 0.8px;
  }
  .header-badge {
    background: var(--accent);
    color: #fff;
    font-size: .75rem;
    padding: .2rem .55rem;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.2rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  /* Dialogue entry layout */
  .dialogue-turn {
    display: flex;
    gap: .85rem;
    width: 100%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dialogue-turn.user {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.6);
    border: 1px solid var(--border-light);
  }
  .dialogue-turn.agent .avatar {
    background: linear-gradient(135deg, #7a1518 0%, #b83324 100%);
    border-color: #d84534;
  }
  .dialogue-turn.user .avatar {
    background: linear-gradient(135deg, #1e2533 0%, #2e384c 100%);
    border-color: #44516d;
  }
  .turn-content {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .dialogue-turn.user .turn-content {
    align-items: flex-end;
  }
  .sender-name {
    font-size: .75rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: .25rem;
    letter-spacing: .4px;
    text-transform: uppercase;
  }
  .bubble {
    display: inline-block;
    padding: .85rem 1.15rem;
    border-radius: 12px;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border-light);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.5;
    box-shadow: 0 3px 12px rgba(0,0,0,.4);
  }
  .dialogue-turn.user .bubble {
    background: linear-gradient(135deg, #681515 0%, #94251f 100%);
    color: #fff;
    border: 1px solid #b8332a;
    border-top-right-radius: 2px;
  }
  .dialogue-turn.agent .bubble {
    border-top-left-radius: 2px;
  }
  /* When the reply is an A2UI card, remove outer bubble chrome */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* Quick example prompt suggestions */
  .prompt-row {
    display: flex;
    gap: .6rem;
    padding: .6rem 1.2rem 0;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
  }
  .prompt-btn {
    background: var(--surface);
    color: #c7cbd1;
    border: 1px solid var(--border-light);
    border-radius: 18px;
    padding: .45rem .9rem;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
  }
  .prompt-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: #d84534;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  /* Input Form */
  form {
    display: flex;
    gap: .6rem;
    padding: 1rem 1.2rem;
    border-top: 1px solid var(--border);
    background: #0d0f14;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: .75rem 1rem;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    font-size: 1rem;
    background: var(--surface);
    color: #fff;
    transition: border-color 0.2s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  button[type="submit"] {
    padding: .75rem 1.3rem;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #a1241f 0%, #c23c2a 100%);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: .3px;
    transition: filter 0.15s ease;
  }
  button[type="submit"]:hover {
    filter: brightness(1.15);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border-light);
    border-radius: 12px;
    padding: 1.15rem;
    background: linear-gradient(180deg, #171b24 0%, #10131a 100%);
    color: var(--text-primary);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: .75rem; }
  .a2col { display: flex; flex-direction: column; gap: .5rem; }
  .a2row { display: flex; flex-direction: row; gap: .75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: #fff; border-bottom: 2px solid var(--accent); padding-bottom: .25rem; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #ff8b7b; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #fff; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #eceff4; }
  .a2text.a2-caption { font-size: .85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border-light); margin: .5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 8px; display: block; border: 1px solid var(--border-light); box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.35rem; line-height: 1; vertical-align: middle; color: #e85341; }
</style>
</head>
<body>
<header>
  <span class="avatar" style="width:30px;height:30px;font-size:.9rem;background:#c23c2a;">⚔️</span>
  <span>DOTA 2 AI Assistant</span>
  <span class="header-badge">Online</span>
</header>
<div id="log"></div>
<div class="prompt-row">
  <button type="button" class="prompt-btn" data-prompt="Roll 1d20+5 for an initiative check and simulate probability of beating DC 15">🎲 Roll 1d20+5 & DC 15 chance</button>
  <button type="button" class="prompt-btn" data-prompt="Search the bestiary for an Adult Red Dragon and show its statblock">🐉 Look up Adult Red Dragon</button>
  <button type="button" class="prompt-btn" data-prompt="Generate artwork for a legendary Flame Tongue greatsword and add it to my inventory">⚔️ Forge Flame Tongue sword</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask something…" autocomplete="off" autofocus>
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const turn = el("div", "dialogue-turn " + who);
  const avatar = el("div", "avatar", who === "agent" ? "🛡️" : "👤");
  const content = el("div", "turn-content");
  const name = el("div", "sender-name", who === "agent" ? "Dota Assistant" : "Player");
  const b = el("div", "bubble");

  content.appendChild(name);
  content.appendChild(b);
  turn.appendChild(avatar);
  turn.appendChild(content);

  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendMessage(text) {
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  sendMessage(input.value.trim());
});

document.querySelectorAll(".prompt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const p = btn.getAttribute("data-prompt");
    if (p) sendMessage(p);
  });
});
</script>
</body>
</html>
